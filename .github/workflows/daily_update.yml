name: Daily Pre-Market Update

on:
  schedule:
    # 22:00 UTC = 06:00 Taiwan time (UTC+8), Mon-Fri Taiwan = Sun-Thu UTC
    - cron: '0 22 * * 0,1,2,3,4'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run daily update
        env:
          CLAUDE_API_KEY:      ${{ secrets.CLAUDE_API_KEY }}
          FRED_API_KEY:        ${{ secrets.FRED_API_KEY }}
          SHEET_ID:            ${{ secrets.SHEET_ID }}
          GOOGLE_CREDENTIALS:  ${{ secrets.GOOGLE_CREDENTIALS }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          cd scripts
          python update.py

      - name: Commit updated index.html to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Print AI debug log to workflow output
          if [ -f debug_ai.json ]; then
            echo "=== AI DEBUG ==="
            cat debug_ai.json
            echo "================"
          else
            echo "=== AI DEBUG: debug_ai.json not found ==="
          fi
          git add index.html
          git add debug_ai.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to index.html"
          else
            git commit -m "🤖 Daily update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
