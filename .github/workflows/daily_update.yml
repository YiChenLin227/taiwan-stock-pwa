name: Daily Pre-Market Update

on:
  schedule:
    # 22:30 UTC = 06:30 Taiwan time (UTC+8), Mon-Fri Taiwan = Sun-Thu UTC
    - cron: '30 22 * * 0,1,2,3,4'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run daily update
        env:
          CLAUDE_API_KEY:      ${{ secrets.CLAUDE_API_KEY }}
          FRED_API_KEY:        ${{ secrets.FRED_API_KEY }}
          SHEET_ID:            ${{ secrets.SHEET_ID }}
          GOOGLE_CREDENTIALS:  ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          cd scripts
          python update.py

      - name: Commit & push updated index.html
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No changes to index.html"
          else
            git commit -m "🤖 Daily update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
